<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Trade — Your Campus. Your Marketplace.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F7; --bg-elevated:#FFFFFF; --surface:#F4F3F0; --surface-hover:#ECEBE7;
    --border:#E7E5E0; --border-strong:#D9D6D0;
    --text:#15161A; --text-dim:#6B6D78; --text-faint:#9A9BA5;
    --accent:#4F46E5; --accent-hover:#4338CA; --accent-soft:#EEEDFC; --accent-contrast:#FFFFFF;
    --rose:#E11D48; --green:#16A34A; --green-soft:#E9F8EF;
    --radius-sm:10px; --radius-md:14px; --radius-lg:20px; --radius-xl:26px;
    --shadow-sm:0 1px 2px rgba(20,20,25,0.04);
    --shadow-md:0 8px 24px -8px rgba(20,20,25,0.10);
    --shadow-lg:0 24px 60px -16px rgba(20,20,25,0.18);
    --font-display:'Plus Jakarta Sans', sans-serif;
    --font-body:'Inter', sans-serif;
    --dur-1:150ms; --dur-2:250ms; --dur-3:420ms;
    --ease: cubic-bezier(.22,.9,.32,1);
    --glass:rgba(255,255,255,0.58); --glass-strong:rgba(255,255,255,0.78);
    --glass-border:rgba(255,255,255,0.72); --glass-shadow:0 12px 34px -18px rgba(31,38,135,0.28);
    --glass-inset:inset 0 1px 0 rgba(255,255,255,0.86); --glass-wash:#EEF2FF;
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#0B0B0D; --bg-elevated:#131317; --surface:#17181C; --surface-hover:#1E1F25;
    --border:#242529; --border-strong:#31323A;
    --text:#F2F2F4; --text-dim:#9EA0AA; --text-faint:#6B6D77;
    --accent:#8683FF; --accent-hover:#9A97FF; --accent-soft:rgba(134,131,255,0.14); --accent-contrast:#0B0B0D;
    --green-soft:rgba(22,163,74,0.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px -8px rgba(0,0,0,0.45);
    --shadow-lg:0 24px 70px -18px rgba(0,0,0,0.6);
    --glass:rgba(24,24,30,0.58); --glass-strong:rgba(28,28,34,0.78);
    --glass-border:rgba(255,255,255,0.12); --glass-shadow:0 14px 40px -18px rgba(0,0,0,0.72);
    --glass-inset:inset 0 1px 0 rgba(255,255,255,0.10); --glass-wash:#171822;
    color-scheme: dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--font-body);}
  body{min-height:100vh; transition:background var(--dur-3) var(--ease), color var(--dur-3) var(--ease);}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  img{display:block; max-width:100%;}
  ::selection{background:var(--accent); color:#fff;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:10px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
    .reveal{opacity:1 !important; transform:none !important;}
  }

  /* ---------- reveal-on-scroll ---------- */
  .reveal{opacity:0; transform:translateY(18px); transition:opacity var(--dur-3) var(--ease), transform var(--dur-3) var(--ease); transition-delay:var(--delay,0ms);}
  .reveal.in-view{opacity:1; transform:translateY(0);}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ 0%{transform:scale(0.6); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1); opacity:1;} }
  @keyframes heartPop{ 0%{transform:scale(1);} 35%{transform:scale(1.35);} 60%{transform:scale(0.9);} 100%{transform:scale(1);} }
  @keyframes spinSlow{ from{transform:rotate(0);} to{transform:rotate(360deg);} }
  @keyframes shimmer{ 0%{background-position:-300px 0;} 100%{background-position:300px 0;} }
  @keyframes floatY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  @keyframes floatY2{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(8px) rotate(4deg);} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,14px) scale(0.96);} to{opacity:1; transform:translate(-50%,0) scale(1);} }

  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  /* ---------- splash ---------- */
  #splash{
    position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; transition:opacity .5s var(--ease), visibility .5s;
  }
  #splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-mark{width:56px; height:56px; border-radius:16px; background:var(--accent); display:flex; align-items:center; justify-content:center; animation:popIn .5s var(--ease);}
  .splash-mark svg{width:26px; height:26px;}
  .splash-word{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:0.02em; color:var(--text-dim);}

  /* ---------- header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:60; background:transparent; border-bottom:1px solid transparent;
    transition:background var(--dur-3) var(--ease), border-color var(--dur-3) var(--ease), box-shadow var(--dur-3) var(--ease);
  }
  header.topbar.scrolled{
    background:rgba(250,249,247,0.78); backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm);
  }
  html[data-theme="dark"] header.topbar.scrolled{ background:rgba(11,11,13,0.72); }
  .topbar-inner{max-width:1180px; margin:0 auto; padding:0 32px; height:68px; display:flex; align-items:center; justify-content:space-between; gap:24px;}
  @media (max-width:640px){ .topbar-inner{padding:0 20px; height:60px;} }

  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform var(--dur-2) var(--ease);}
  .brand:hover .brand-mark{transform:rotate(-8deg) scale(1.05);}
  .brand-mark svg{width:16px; height:16px;}
  .brand-word{font-family:var(--font-display); font-weight:800; font-size:16.5px; letter-spacing:-0.01em;}

  nav.main-nav{display:flex; align-items:center; gap:2px;}
  nav.main-nav a{font-size:14px; color:var(--text-dim); padding:9px 15px; border-radius:9px; font-weight:600; transition:color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);}
  nav.main-nav a:hover{color:var(--text); background:var(--surface);}
  nav.main-nav a.active{color:var(--text); background:var(--surface);}
  @media (max-width:860px){ nav.main-nav{display:none;} }

  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--bg-elevated);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); position:relative;
    transition:all var(--dur-2) var(--ease);
  }
  .icon-btn:hover{color:var(--text); border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .icon-btn:active{transform:translateY(0) scale(0.95);}
  .icon-btn svg{width:16px; height:16px;}
  .avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12.5px; border:none; flex-shrink:0; transition:transform var(--dur-2) var(--ease);}
  .avatar:hover{transform:scale(1.06);}
  .dot-badge{position:absolute; top:7px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--rose); box-shadow:0 0 0 2px var(--bg-elevated);}

  main{flex:1; padding-bottom:70px;}
  @media (min-width:769px){ main{padding-bottom:0;} }

  footer.site-footer{border-top:1px solid var(--border); padding:44px 0; margin-top:60px; display:none;}
  @media (min-width:769px){ footer.site-footer{display:block;} }
  .footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;}
  .footer-brand{display:flex; align-items:center; gap:10px;}
  .footer-brand .brand-mark{width:26px; height:26px;}
  .footer-brand .brand-mark svg{width:13px; height:13px;}
  .footer-tagline{color:var(--text-faint); font-size:13px; margin-left:4px;}
  .footer-links{display:flex; gap:26px; font-size:13.5px; color:var(--text-dim); font-weight:500;}
  .footer-links a:hover{color:var(--text);}
  .footer-copy{color:var(--text-faint); font-size:12.5px;}

  /* ---------- bottom nav (mobile) ---------- */
  .bottom-nav{
    display:none; position:fixed; bottom:0; left:0; right:0; z-index:60; height:64px;
    background:rgba(250,249,247,0.92); backdrop-filter:blur(16px); border-top:1px solid var(--border);
    align-items:center; justify-content:space-around; padding-bottom:env(safe-area-inset-bottom);
  }
  html[data-theme="dark"] .bottom-nav{ background:rgba(11,11,13,0.92); }
  @media (max-width:768px){ .bottom-nav{display:flex;} }
  .bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:10.5px; font-weight:600; flex:1; padding:6px 0; transition:color var(--dur-2) var(--ease);}
  .bn-item svg{width:20px; height:20px;}
  .bn-item.active{color:var(--accent);}
  .bn-sell{position:relative; top:-14px;}
  .bn-sell-btn{width:46px; height:46px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -6px rgba(79,70,229,0.5); margin-bottom:2px; transition:transform var(--dur-2) var(--ease);}
  .bn-sell-btn:active{transform:scale(0.9);}
  .bn-sell-btn svg{width:20px; height:20px;}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex; align-items:center; gap:8px; justify-content:center; font-weight:600; font-size:14.5px; padding:12px 22px; border-radius:11px; border:1px solid transparent; transition:transform var(--dur-1) var(--ease), box-shadow var(--dur-2) var(--ease), background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);}
  .btn svg{width:15px; height:15px; transition:transform var(--dur-2) var(--ease);}
  .btn:hover svg.arrow-i{transform:translateX(3px);}
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.06), 0 0 0 0 rgba(79,70,229,0);}
  .btn-primary:hover{background:var(--accent-hover); box-shadow:0 8px 20px -6px rgba(79,70,229,0.45);}
  .btn-outline{background:var(--bg-elevated); border-color:var(--border-strong); color:var(--text);}
  .btn-outline:hover{border-color:var(--text-faint); box-shadow:var(--shadow-sm);}
  .btn-ghost{background:var(--surface); color:var(--text); border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-hover);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px; font-size:13.5px;}
  .btn[disabled]{opacity:0.4; pointer-events:none;}

  /* ---------- hero ---------- */
  .hero{padding:76px 0 40px; position:relative; overflow:hidden;}
  .float-deco{position:absolute; border-radius:50%; filter:blur(0px); z-index:0; opacity:0.55;}
  .fd1{width:64px; height:64px; background:var(--accent-soft); top:60px; left:-10px; animation:floatY 7s ease-in-out infinite;}
  .fd2{width:44px; height:44px; background:var(--green-soft); top:220px; left:40%; animation:floatY2 8.5s ease-in-out infinite;}
  .fd3{width:26px; height:26px; border:2px solid var(--border-strong); background:transparent; top:120px; right:6%; animation:floatY 6s ease-in-out infinite;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:22px; background:var(--surface); border:1px solid var(--border); padding:7px 14px 7px 10px; border-radius:30px; position:relative; z-index:1;}
  .eyebrow .pulse{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px var(--green-soft);}
  .hero-grid{display:grid; grid-template-columns:1.05fr 0.95fr; gap:50px; align-items:center; position:relative; z-index:1;}
  @media (max-width:920px){ .hero-grid{grid-template-columns:1fr;} }

  .hero-title{font-family:var(--font-display); font-weight:800; line-height:1.04; letter-spacing:-0.03em; font-size:clamp(38px,5.6vw,64px);}
  .hero-title .accent-word{color:var(--accent);}
  .hero-sub{color:var(--text-dim); font-size:17px; line-height:1.65; max-width:460px; margin:22px 0 32px; font-weight:450;}
  .hero-ctas{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:36px;}
  .trust-row{display:flex; align-items:center; gap:12px;}
  .avatar-stack{display:flex;}
  .avatar-stack .mini-avatar{width:30px; height:30px; border-radius:50%; border:2.5px solid var(--bg); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; font-family:var(--font-display); margin-left:-9px; color:#20233b;}
  .avatar-stack .mini-avatar:first-child{margin-left:0;}
  .trust-text{font-size:13.5px; color:var(--text-dim);}
  .trust-text b{color:var(--text); font-weight:700;}

  /* hero device mock */
  .device{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-lg); transform:rotate(1.1deg); transition:transform var(--dur-3) var(--ease);}
  .device:hover{transform:rotate(0deg) translateY(-3px);}
  .device-bar{display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid var(--border);}
  .device-dots{display:flex; gap:6px;}
  .device-dots span{width:9px; height:9px; border-radius:50%; background:var(--surface-hover);}
  .device-path{font-size:12px; color:var(--text-faint); font-weight:500;}
  .verified-chip{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--green); background:var(--green-soft); padding:5px 11px; border-radius:20px; font-weight:700;}
  .verified-chip svg{width:12px; height:12px;}
  .device-body{padding:24px;}
  .device-greet{font-size:13px; color:var(--text-dim); margin-bottom:4px; font-weight:500;}
  .device-title{font-family:var(--font-display); font-size:23px; font-weight:700; letter-spacing:-0.01em;}
  .device-search{margin-top:18px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:12px 15px; color:var(--text-faint); font-size:13.5px;}
  .device-search svg{width:15px; height:15px; flex-shrink:0;}
  .device-pills{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .device-pill{font-size:12.5px; padding:7px 13px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); background:var(--bg-elevated); font-weight:600;}
  .device-pill.active{background:var(--accent); color:#fff; border-color:transparent;}
  .device-items{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px;}
  @media (max-width:520px){ .device-items{grid-template-columns:repeat(2,1fr);} }
  .device-item img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:9px;}
  .device-item .di-name{font-size:11px; margin-top:6px; font-weight:600; line-height:1.3;}
  .device-item .di-price{font-size:11px; color:var(--accent); font-weight:700;}

  /* ---------- section header ---------- */
  .section{padding:56px 0;}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px; gap:20px; flex-wrap:wrap;}
  .section-eyebrow{font-size:13px; color:var(--text-faint); font-weight:600; margin-bottom:10px;}
  .section-title{font-family:var(--font-display); font-size:clamp(26px,3.2vw,34px); font-weight:800; line-height:1.1; letter-spacing:-0.02em;}
  .section-title .accent{color:var(--accent);}
  .link-arrow{display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; padding:8px 4px;}
  .link-arrow svg{width:14px; height:14px; transition:transform var(--dur-2) var(--ease);}
  .link-arrow:hover svg{transform:translateX(3px);}

  /* category grid */
  .cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:720px){ .cat-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .cat-grid{grid-template-columns:1fr;} }
  .cat-cell{
    padding:22px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-elevated);
    display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer;
    transition:border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  }
  .cat-cell:hover{border-color:var(--border-strong); box-shadow:var(--shadow-md); transform:translateY(-3px);}
  .cat-cell:hover .cat-icon{background:var(--accent); color:#fff; transform:scale(1.08) rotate(-4deg);}
  .cat-left{display:flex; align-items:center; gap:14px;}
  .cat-icon{width:42px; height:42px; border-radius:11px; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-dim); transition:all var(--dur-2) var(--ease);}
  .cat-icon svg{width:19px; height:19px;}
  .cat-name{font-weight:700; font-size:15px;}
  .cat-desc{font-size:13px; color:var(--text-faint); margin-top:2px;}
  .cat-cell svg.chev{width:15px; height:15px; color:var(--text-faint); flex-shrink:0; transition:transform var(--dur-2) var(--ease);}
  .cat-cell:hover svg.chev{transform:translateX(3px); color:var(--text);}

  /* item card grid */
  .item-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  @media (max-width:980px){ .item-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .item-grid{grid-template-columns:repeat(2,1fr); gap:12px;} }
  .item-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; cursor:pointer;
    transition:border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  }
  .item-card:hover{border-color:var(--border-strong); box-shadow:var(--shadow-md); transform:translateY(-4px);}
  .item-media{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--surface);}
  .item-media img{width:100%; height:100%; object-fit:cover; transition:transform var(--dur-3) var(--ease);}
  .item-card:hover .item-media img{transform:scale(1.06);}
  .cond-badge{position:absolute; bottom:10px; left:10px; background:rgba(21,22,26,0.68); backdrop-filter:blur(4px); color:#fff; font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:7px;}
  html[data-theme="dark"] .cond-badge{ background:rgba(255,255,255,0.14); }
  .wish-btn{position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text); transition:transform var(--dur-1) var(--ease), border-color var(--dur-2) var(--ease);}
  .wish-btn:hover{border-color:var(--border-strong);}
  .wish-btn svg{width:15px; height:15px; transition:all var(--dur-2) var(--ease);}
  .wish-btn.saved svg{fill:var(--rose); color:var(--rose); stroke:var(--rose);}
  .wish-btn.pop{animation:heartPop .4s var(--ease);}
  .item-info{padding:14px 14px 15px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item-name{font-weight:700; font-size:14px; line-height:1.35;}
  .item-price{font-weight:800; font-size:14px; color:var(--text); white-space:nowrap; font-family:var(--font-display);}
  .item-meta{font-size:12px; color:var(--text-faint); margin-top:6px;}

  /* skeleton */
  .skeleton-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
  .sk-media{aspect-ratio:4/3; background:linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 37%, var(--surface) 63%); background-size:400% 100%; animation:shimmer 1.6s linear infinite;}
  .sk-line{height:12px; border-radius:6px; background:linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 37%, var(--surface) 63%); background-size:400% 100%; animation:shimmer 1.6s linear infinite; margin:14px 14px 0;}
  .sk-line.w60{width:60%;} .sk-line.w40{width:40%; margin-top:8px; margin-bottom:14px;}

  /* banner cta */
  .banner{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-xl); padding:48px; display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; position:relative; overflow:hidden;}
  .banner-label{font-size:13px; color:var(--text-faint); font-weight:600; margin-bottom:12px;}
  .banner-title{font-family:var(--font-display); font-size:clamp(24px,3.4vw,32px); font-weight:800; line-height:1.15; letter-spacing:-0.02em;}

  /* ---------- marketplace page ---------- */
  .market-hero{padding:52px 0 30px;}
  .search-row{display:flex; gap:14px; margin-top:26px; flex-wrap:wrap;}
  .search-box{flex:1; min-width:240px; display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:13px; padding:14px 16px; transition:border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);}
  .search-box:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .search-box svg{width:17px; height:17px; color:var(--text-faint); flex-shrink:0;}
  .search-box input{background:transparent; border:none; outline:none; color:var(--text); font-size:15px; width:100%; font-family:inherit;}
  .search-box input::placeholder{color:var(--text-faint);}
  .kbd{font-size:11px; color:var(--text-faint); border:1px solid var(--border); border-radius:5px; padding:3px 6px; font-family:inherit;}
  .filter-pills{display:flex; gap:9px; margin-top:20px; flex-wrap:wrap;}
  .fpill{font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); background:var(--bg-elevated); display:flex; align-items:center; gap:7px; transition:all var(--dur-2) var(--ease);}
  .fpill:hover{border-color:var(--border-strong); color:var(--text); transform:translateY(-1px);}
  .fpill.active{background:var(--accent); color:#fff; border-color:transparent;}
  .results-row{display:flex; justify-content:space-between; align-items:center; margin:30px 0 22px; font-size:13.5px; color:var(--text-dim);}
  .results-row b{color:var(--text);}
  .sort-select{background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); font-size:13.5px; padding:9px 12px; border-radius:9px; font-family:inherit;}
  .empty-state{text-align:center; padding:80px 20px; color:var(--text-faint);}
  .empty-state .es-icon{width:56px; height:56px; border-radius:16px; background:var(--surface); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:var(--text-faint);}
  .empty-state .es-icon svg{width:24px; height:24px;}
  .empty-title{font-weight:700; color:var(--text); font-family:var(--font-display); font-size:17px; margin-bottom:6px;}

  /* ---------- product detail ---------- */
  .pd-wrap{padding:36px 0 70px;}
  .breadcrumb{font-size:13px; color:var(--text-faint); margin-bottom:24px; display:flex; align-items:center; gap:6px;}
  .breadcrumb a:hover{color:var(--text);}
  .pd-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:52px; align-items:start;}
  @media (max-width:860px){ .pd-grid{grid-template-columns:1fr; gap:32px;} }
  .pd-gallery-main{border-radius:var(--radius-lg); overflow:hidden; aspect-ratio:4/3.2; background:var(--surface); border:1px solid var(--border); position:relative;}
  .pd-gallery-main img{width:100%; height:100%; object-fit:cover; animation:fadeUp .35s var(--ease);}
  .pd-thumbs{display:flex; gap:10px; margin-top:12px;}
  .pd-thumb{width:70px; height:70px; border-radius:10px; overflow:hidden; border:2px solid transparent; cursor:pointer; opacity:0.6; transition:all var(--dur-2) var(--ease); flex-shrink:0;}
  .pd-thumb.active{border-color:var(--accent); opacity:1;}
  .pd-thumb:hover{opacity:1;}
  .pd-thumb img{width:100%; height:100%; object-fit:cover;}
  .pd-badges{display:flex; gap:8px; margin-bottom:16px;}
  .pd-badge{font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; background:var(--surface); color:var(--text-dim);}
  .pd-title{font-family:var(--font-display); font-size:clamp(24px,3vw,32px); font-weight:800; letter-spacing:-0.01em; line-height:1.15;}
  .pd-price{font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--accent); margin-top:12px;}
  .pd-desc{color:var(--text-dim); font-size:15px; line-height:1.7; margin:22px 0; padding:20px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .seller-card{display:flex; align-items:center; gap:14px; padding:16px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:22px;}
  .seller-avatar{width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); flex-shrink:0;}
  .seller-name{font-weight:700; font-size:14.5px;}
  .seller-meta{font-size:12.5px; color:var(--text-faint); margin-top:2px;}
  .pd-actions{display:flex; gap:12px;}
  .pd-actions .btn-primary{flex:1;}

  /* ---------- sell wizard ---------- */
  .sell-wrap{padding:52px 0 90px;}
  .sell-grid{display:grid; grid-template-columns:280px 1fr; gap:56px; margin-top:44px; align-items:start;}
  @media (max-width:820px){ .sell-grid{grid-template-columns:1fr;} }
  .steps{position:relative;}
  .step-item{display:flex; gap:16px; padding-bottom:34px; position:relative;}
  .step-item:last-child{padding-bottom:0;}
  .step-item::before{content:''; position:absolute; left:15px; top:34px; bottom:0; width:1px; background:var(--border);}
  .step-item:last-child::before{display:none;}
  .step-num{width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; z-index:1; color:var(--text-dim); transition:all var(--dur-2) var(--ease);}
  .step-item.done .step-num{background:var(--green); border-color:var(--green); color:#fff;}
  .step-item.current .step-num{background:var(--accent); border-color:var(--accent); color:#fff;}
  .step-title{font-weight:700; font-size:15px;}
  .step-item.pending .step-title{color:var(--text-dim);}
  .step-sub{font-size:13px; color:var(--text-faint); margin-top:2px;}

  .panel{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-sm);}
  .panel-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .panel-step-label{font-size:12.5px; color:var(--text-faint); font-weight:600;}
  .draft-saved{font-size:12.5px; color:var(--green); font-weight:700; display:flex; align-items:center; gap:6px;}
  .draft-saved svg{width:13px; height:13px;}
  .panel-heading{font-family:var(--font-display); font-size:26px; font-weight:800; margin-bottom:8px; letter-spacing:-0.01em;}
  .panel-desc{color:var(--text-dim); font-size:14.5px; margin-bottom:28px;}

  .dropzone{border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); padding:50px 24px; text-align:center; transition:border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease); cursor:pointer;}
  .dropzone:hover, .dropzone.drag{border-color:var(--accent); background:var(--accent-soft);}
  .dropzone-icon{width:46px; height:46px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  .dropzone-icon svg{width:19px; height:19px;}
  .dropzone-title{font-weight:700; font-size:15.5px;}
  .dropzone-sub{font-size:13.5px; color:var(--text-dim); margin-top:6px;}
  .dropzone-sub a{color:var(--accent); text-decoration:underline; font-weight:600;}
  .dropzone-hint{font-size:12px; color:var(--text-faint); margin-top:14px;}
  .photo-strip{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
  .photo-thumb{width:90px; height:90px; border-radius:11px; overflow:hidden; position:relative; border:1px solid var(--border); animation:popIn .35s var(--ease);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover;}
  .photo-thumb button{position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; background:rgba(15,15,18,0.65); border:none; color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity var(--dur-2) var(--ease);}
  .photo-thumb:hover button{opacity:1;}
  .photo-thumb button svg{width:11px; height:11px;}

  .field{margin-bottom:20px;}
  .field label{display:block; font-size:13.5px; font-weight:700; margin-bottom:8px; color:var(--text);}
  .field .hint{font-weight:400; color:var(--text-faint); font-size:12.5px; margin-left:6px;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:13px 14px;
    color:var(--text); font-size:14.5px; font-family:inherit; outline:none; transition:border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .field textarea{resize:vertical; min-height:100px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:520px){ .field-row{grid-template-columns:1fr;} }
  .chip-select{display:flex; gap:10px; flex-wrap:wrap;}
  .chip-opt{padding:10px 16px; border-radius:10px; border:1px solid var(--border); font-size:13.5px; font-weight:700; color:var(--text-dim); background:var(--bg); transition:all var(--dur-2) var(--ease);}
  .chip-opt.sel{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .price-input{position:relative;}
  .price-input .rupee{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-weight:700;}
  .price-input input{padding-left:30px !important;}
  .panel-actions{display:flex; justify-content:space-between; margin-top:32px; gap:12px;}
  .review-row{display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .review-row span:first-child{color:var(--text-faint);}
  .review-row span:last-child{font-weight:700; text-align:right;}
  .review-photo{width:100%; max-width:220px; border-radius:var(--radius-md); aspect-ratio:4/3; object-fit:cover; margin-bottom:20px; border:1px solid var(--border);}
  .success-box{text-align:center; padding:26px 0;}
  .success-icon{width:68px; height:68px; border-radius:50%; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; animation:popIn .5s var(--ease);}
  .success-icon svg{width:30px; height:30px;}

  /* ---------- messages ---------- */
  .msg-wrap{padding:52px 0 40px;}
  .msg-title-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:16px;}
  .msg-grid{display:grid; grid-template-columns:320px 1fr; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; height:580px; box-shadow:var(--shadow-sm);}
  @media (max-width:760px){ .msg-grid{grid-template-columns:1fr; height:calc(100vh - 200px); border-radius:var(--radius-md);} .msg-thread{display:none;} .msg-grid.thread-open .conv-list{display:none;} .msg-grid.thread-open .msg-thread{display:flex;} }
  .conv-list{border-right:1px solid var(--border); overflow-y:auto; background:var(--bg-elevated);}
  .conv-list-head{padding:18px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .conv-list-head b{font-size:14.5px; font-family:var(--font-display);}
  .unread-tag{font-size:12px; color:var(--accent); font-weight:700;}
  .conv-row{display:flex; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:background var(--dur-2) var(--ease);}
  .conv-row:hover{background:var(--surface);}
  .conv-row.active{background:var(--accent-soft);}
  .conv-avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0;}
  .conv-body{flex:1; min-width:0;}
  .conv-top{display:flex; justify-content:space-between; gap:8px;}
  .conv-name{font-weight:700; font-size:14px;}
  .conv-time{font-size:11.5px; color:var(--text-faint); flex-shrink:0;}
  .conv-preview{font-size:13px; color:var(--text-dim); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .conv-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:5px;}

  .msg-thread{display:flex; flex-direction:column; background:var(--bg);}
  .thread-head{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--border); background:var(--bg-elevated);}
  .thread-who{display:flex; align-items:center; gap:12px;}
  .status-line{font-size:12.5px; color:var(--green); display:flex; align-items:center; gap:6px; font-weight:500;}
  .status-line .dot{width:6px; height:6px; border-radius:50%; background:var(--green);}
  .listing-ref{display:flex; align-items:center; gap:14px; margin:16px 22px; padding:14px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-elevated);}
  .listing-ref img{width:46px; height:46px; border-radius:9px; object-fit:cover;}
  .listing-ref-body{flex:1;}
  .listing-ref-label{font-size:11.5px; color:var(--text-faint);}
  .listing-ref-name{font-weight:700; font-size:14px; margin-top:1px;}
  .listing-ref-price{font-size:13px; color:var(--accent); font-weight:700;}
  .thread-scroll{flex:1; overflow-y:auto; padding:10px 22px; display:flex; flex-direction:column; gap:12px;}
  .day-sep{text-align:center; font-size:11.5px; color:var(--text-faint); margin:10px 0;}
  .bubble{max-width:70%; padding:11px 15px; border-radius:16px; font-size:14px; line-height:1.45; animation:fadeUp .3s var(--ease);}
  .bubble.them{background:var(--bg-elevated); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px;}
  .bubble.me{background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; font-weight:500;}
  .bubble-time{font-size:10.5px; margin-top:5px; opacity:0.65;}
  .thread-input{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--border); background:var(--bg-elevated);}
  .thread-input input{flex:1; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:12px 14px; color:var(--text); outline:none; font-size:14px; font-family:inherit; transition:border-color var(--dur-2) var(--ease);}
  .thread-input input:focus{border-color:var(--accent);}
  .send-btn{width:44px; height:44px; border-radius:11px; background:var(--accent); border:none; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform var(--dur-1) var(--ease), background var(--dur-2) var(--ease);}
  .send-btn:hover{background:var(--accent-hover);}
  .send-btn:active{transform:scale(0.9);}
  .send-btn svg{width:17px; height:17px;}
  .back-conv{display:none; color:var(--text-dim); font-size:13px; align-items:center; gap:6px; font-weight:600;}
  @media (max-width:760px){ .back-conv{display:flex;} }

  /* ---------- profile ---------- */
  .profile-wrap{padding:52px 0 60px;}
  .profile-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;}
  .profile-id{display:flex; gap:20px; align-items:center;}
  .profile-avatar{width:76px; height:76px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:27px; flex-shrink:0;}
  .profile-name{font-family:var(--font-display); font-size:28px; font-weight:800; letter-spacing:-0.01em;}
  .profile-sub{color:var(--text-dim); font-size:14.5px; margin-top:6px;}
  .profile-since{color:var(--text-faint); font-size:13px; margin-top:4px;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); border-radius:var(--radius-lg); margin:38px 0; overflow:hidden; background:var(--bg-elevated);}
  @media (max-width:600px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
  .stat-cell{padding:26px 24px; border-right:1px solid var(--border);}
  .stat-cell:last-child{border-right:none;}
  @media (max-width:600px){ .stat-cell:nth-child(2n){border-right:none;} .stat-cell:nth-child(-n+2){border-bottom:1px solid var(--border);} }
  .stat-num{font-family:var(--font-display); font-size:30px; font-weight:800;}
  .stat-label{color:var(--text-faint); font-size:13px; margin-top:4px;}
  .tab-row{display:flex; gap:28px; border-bottom:1px solid var(--border); margin-bottom:28px;}
  .tab-btn{padding:12px 2px; font-weight:700; font-size:14.5px; color:var(--text-faint); border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; align-items:center; gap:8px; transition:color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);}
  .tab-btn.active{color:var(--text); border-color:var(--accent);}
  .tab-count{background:var(--surface); color:var(--text-dim); font-size:11.5px; padding:2px 7px; border-radius:20px; font-weight:700;}

  /* ---------- dashboard ---------- */
  .dash-wrap{padding:52px 0 60px;}
  .dash-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:36px 0;}
  @media (max-width:640px){ .dash-stats{grid-template-columns:1fr;} }
  .dash-stat{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px; display:flex; align-items:center; gap:16px; transition:transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);}
  .dash-stat:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
  .dash-stat-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .dash-stat-icon svg{width:20px; height:20px;}
  .dash-stat-num{font-family:var(--font-display); font-size:26px; font-weight:800;}
  .dash-stat-label{font-size:13px; color:var(--text-faint);}

  /* toast */
  #toast{position:fixed; bottom:26px; left:50%; z-index:200; opacity:0; visibility:hidden; pointer-events:none;
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); padding:14px 22px; border-radius:13px;
    font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg);
    transform:translate(-50%,14px);
  }
  #toast.show{opacity:1; visibility:visible; animation:toastIn .35s var(--ease) forwards;}
  #toast .toast-icon{width:20px; height:20px; border-radius:50%; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  #toast .toast-icon svg{width:11px; height:11px; animation:popIn .4s var(--ease);}
  @media (max-width:640px){ #toast{bottom:78px;} }

  /* cinematic campus opening */
  #splash{overflow:hidden;background:#07090d;gap:0;color:#fff;transition:opacity .8s var(--ease),visibility .8s;}
  .splash-campus{position:absolute;inset:-3%;width:106%;height:106%;max-width:none;object-fit:cover;animation:splashDrift 4.2s cubic-bezier(.2,.75,.2,1) both;}
  .splash-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,13,.22),rgba(5,8,13,.66));}
  .splash-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;}
  .splash-mark{width:76px;height:76px;border-radius:50%;background:rgba(10,12,16,.38);border:1px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(10px);animation:crestIn 1.1s var(--ease) .15s both;}
  .splash-mark svg{width:42px;height:42px;}
  .splash-word{margin-top:22px;color:#fff;font-family:var(--font-display);font-size:clamp(26px,5vw,52px);font-weight:800;letter-spacing:.12em;animation:titleReveal 1.2s var(--ease) .35s both;}
  .splash-tagline{margin-top:9px;font-size:clamp(10px,1.5vw,13px);font-weight:600;letter-spacing:.28em;color:rgba(255,255,255,.76);animation:titleReveal 1.2s var(--ease) .58s both;}
  .splash-line{width:min(280px,64vw);height:1px;background:rgba(255,255,255,.25);margin-top:28px;overflow:hidden;}
  .splash-line span{display:block;width:100%;height:100%;background:#fff;transform-origin:left;animation:lineLoad 2s ease .55s both;}
  @keyframes splashDrift{from{transform:scale(1.09) translateY(1.5%);filter:saturate(.75)}to{transform:scale(1) translateY(0);filter:saturate(1)}}
  @keyframes crestIn{from{opacity:0;transform:scale(.72) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes titleReveal{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes lineLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}

let observer;
function mountReveals(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in-view'); observer.unobserve(e.target); } });
  }, {threshold:0.12});
  document.querySelectorAll('.reveal').forEach(el=> observer.observe(el));
}

  const delay = (idx % 8) * 60;
  return `
  <div class="item-card reveal" style="--delay:${delay}ms" onclick="openItem('${it.id}')">
    <div class="item-media">
      <img src="${it.img}" alt="${it.name}" loading="lazy"/>
      <span class="cond-badge">${it.condition}</span>
      <button class="wish-btn ${saved?'saved':''}" onclick="event.stopPropagation(); toggleWish('${it.id}', this)">${ICONS.heart}</button>
    </div>
    <div class="item-info">
      <div class="item-top">
        <div class="item-name">${it.name}</div>
        <div class="item-price">${fmtPrice(it.price)}</div>
      </div>
      <div class="item-meta">${it.seller} · ${it.year} · ${it.time}</div>
    </div>
  </div>`;
}

function SkeletonGrid(n){
  return `<div class="item-grid">${Array.from({length:n}).map(()=>`
    <div class="skeleton-card">
      <div class="sk-media"></div>
      <div class="sk-line w60"></div>
      <div class="sk-line w40"></div>
    </div>`).join('')}</div>`;
}

function toggleWish(id, btnEl){
  if(state.wishlist.has(id)){ state.wishlist.delete(id); }
  else { state.wishlist.add(id); showToast('Saved to your wishlist'); }
  if(btnEl){
    btnEl.classList.toggle('saved', state.wishlist.has(id));
    btnEl.classList.remove('pop'); void btnEl.offsetWidth; btnEl.classList.add('pop');
  } else { render(); }
}
function openItem(id){ navigate('#/item/' + id); }

// ---------- MARKETPLACE ----------
function getFilteredItems(){
  let list = items.slice();
  if(state.activeCategory !== 'all') list = list.filter(i=>i.category===state.activeCategory);
  if(state.searchQuery.trim()){
    const q = state.searchQuery.toLowerCase();
    list = list.filter(i=> i.name.toLowerCase().includes(q) || i.category.includes(q));
  }
  if(state.sort === 'low') list.sort((a,b)=>a.price-b.price);
  else if(state.sort === 'high') list.sort((a,b)=>b.price-a.price);
  return list;
}

const STEP_DEFS = [
  {n:1, title:'Upload photos', sub:'Show it at its best'},
  {n:2, title:'Item details', sub:'The useful details'},
  {n:3, title:'Price & condition', sub:'Keep it fair'},
  {n:4, title:'Publish', sub:'One last look'},
];
function stepStatus(n){ if(n < state.sellStep) return 'done'; if(n === state.sellStep) return 'current'; return 'pending'; }
function viewSell(){
  return `
  <section class="sell-wrap wrap">
    <div class="section-eyebrow">CREATE A LISTING</div>
    <h1 class="hero-title" style="font-size:clamp(30px,4.2vw,46px);">Turn clutter into<br/><span class="accent-word">campus currency.</span></h1>

    <div class="sell-grid">
      <div class="steps">
        ${STEP_DEFS.map(s=>`
          <div class="step-item ${stepStatus(s.n)}">
            <div class="step-num">${stepStatus(s.n)==='done' ? ICONS.check : s.n}</div>
            <div><div class="step-title">${s.title}</div><div class="step-sub">${s.sub}</div></div>
          </div>`).join('')}
      </div>
      <div class="panel" id="sellPanel">${sellPanel()}</div>
    </div>
  </section>`;
}

function sellPanel(){
  const d = state.sellDraft;
  const topBar = `<div class="panel-top"><span class="panel-step-label">Step ${state.sellStep} of 4</span><span class="draft-saved">${ICONS.check} Draft saved</span></div>`;

  if(state.sellStep === 1){
    return `${topBar}
      <div class="panel-heading">Show your item some love.</div>
      <div class="panel-desc">Add up to 5 clear photos. The first photo will be your cover.</div>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()"
           ondragover="event.preventDefault(); this.classList.add('drag')" ondragleave="this.classList.remove('drag')"
           ondrop="handleDrop(event)">
        <div class="dropzone-icon">${ICONS.upload}</div>
        <div class="dropzone-title">Drop photos here</div>
        <div class="dropzone-sub">or <a onclick="event.stopPropagation()">browse from your device</a></div>
        <div class="dropzone-hint">JPG, PNG up to 10MB</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="onPhotosSelected(event)"/>
      ${d.photos.length ? `<div class="photo-strip">${d.photos.map((p,idx)=>`
        <div class="photo-thumb"><img src="${p}"/><button onclick="removePhoto(${idx})">${ICONS.x}</button></div>`).join('')}</div>` : ''}
      <div class="panel-actions">
        <span></span>
        <button class="btn btn-primary" ${d.photos.length===0?'disabled':''} onclick="sellNext()">Continue ${ICONS.arrow}</button>
      </div>`;
  }
  if(state.sellStep === 2){
    return `${topBar}
      <div class="panel-heading">What are you letting go of?</div>
      <div class="panel-desc">A clear title and description helps it sell faster.</div>
      <div class="field"><label>Title</label>
        <input type="text" placeholder="e.g. Casio Scientific Calculator" value="${d.title}" oninput="updateDraft('title', this.value)"/></div>
      <div class="field"><label>Category</label>
        <select onchange="updateDraft('category', this.value)">${CATEGORIES.map(c=>`<option value="${c.id}" ${d.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label>Description <span class="hint">optional</span></label>
        <textarea placeholder="Mention age, any wear, and why you're selling it." oninput="updateDraft('description', this.value)">${d.description}</textarea></div>
      <div class="panel-actions">
        <button class="btn btn-outline" onclick="sellBack()">Back</button>
        <button class="btn btn-primary" ${d.title.trim()===''?'disabled':''} onclick="sellNext()">Continue ${ICONS.arrow}</button>
      </div>`;
  }
  if(state.sellStep === 3){
    const conds = ['Like new','Good condition','Fair condition'];
    return `${topBar}
      <div class="panel-heading">Set a fair price.</div>
      <div class="panel-desc">Take a look at similar items nearby before you decide.</div>
      <div class="field"><label>Price</label>
        <div class="price-input"><span class="rupee">₹</span><input type="number" placeholder="0" value="${d.price}" oninput="updateDraft('price', this.value)"/></div></div>
      <div class="field"><label>Condition</label>
        <div class="chip-select">${conds.map(c=>`<button class="chip-opt ${d.condition===c?'sel':''}" onclick="updateDraft('condition','${c}')">${c}</button>`).join('')}</div></div>
      <div class="panel-actions">
        <button class="btn btn-outline" onclick="sellBack()">Back</button>
        <button class="btn btn-primary" ${!d.price?'disabled':''} onclick="sellNext()">Continue ${ICONS.arrow}</button>
      </div>`;
  }
  const catName = (CATEGORIES.find(c=>c.id===d.category)||{}).name || d.category;
  return `${topBar}
    <div class="panel-heading">One last look.</div>
    <div class="panel-desc">Make sure everything is right before it goes live.</div>
    ${d.photos[0] ? `<img class="review-photo" src="${d.photos[0]}"/>` : ''}
    <div class="review-row"><span>Title</span><span>${d.title || '—'}</span></div>
    <div class="review-row"><span>Category</span><span>${catName}</span></div>
    <div class="review-row"><span>Condition</span><span>${d.condition}</span></div>
    <div class="review-row"><span>Price</span><span>${d.price ? fmtPrice(d.price) : '—'}</span></div>
    <div class="panel-actions">
      <button class="btn btn-outline" onclick="sellBack()">Back</button>
      <button class="btn btn-primary" onclick="publishListing()">Publish listing ${ICONS.check}</button>
    </div>`;
}
function updateDraft(key, val){ state.sellDraft[key] = val; document.getElementById('sellPanel').innerHTML = sellPanel(); }
function handleDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag'); addPhotoFiles(e.dataTransfer.files); }
function onPhotosSelected(e){ addPhotoFiles(e.target.files); }
function addPhotoFiles(files){
  Array.from(files||[]).forEach(f=>{
    const reader = new FileReader();
    reader.onload = ev => { state.sellDraft.photos.push(ev.target.result); document.getElementById('sellPanel').innerHTML = sellPanel(); };
    reader.readAsDataURL(f);
  });
}
function removePhoto(idx){ state.sellDraft.photos.splice(idx,1); document.getElementById('sellPanel').innerHTML = sellPanel(); }
function sellNext(){ if(state.sellStep < 4) state.sellStep++; renderMainOnly(); window.scrollTo({top:0,behavior:'smooth'}); }
function sellBack(){ if(state.sellStep > 1) state.sellStep--; renderMainOnly(); window.scrollTo({top:0,behavior:'smooth'}); }
function publishListing(){
  const d = state.sellDraft;
  const id = 'i' + (++uidCounter);
  items.unshift({
    id, name: d.title || 'Untitled item', price: Number(d.price)||0, category: d.category,
    condition: d.condition, seller: user.name.split(' ')[0], year:'3rd Year', time:'Just now',
    desc: d.description || '',
    img: d.photos[0] || 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=700&q=80&auto=format&fit=crop'
  });
  document.getElementById('sellPanel').innerHTML = `
    <div class="success-box">
      <div class="success-icon">${ICONS.check}</div>
      <div class="panel-heading">You're all set.</div>
      <div class="panel-desc">Your item is now live on Campus Trade.</div>
      <button class="btn btn-primary btn-block" onclick="finishSell()">View in marketplace ${ICONS.arrow}</button>
    </div>`;
}
function finishSell(){
  state.sellStep = 1;
  state.sellDraft = { photos: [], title:'', category:'books', description:'', price:'', condition:'Good condition' };
  showToast('Your listing is live on Campus Trade');
  navigate('#/marketplace');
}

function viewMessages(){
  const convoIds = Object.keys(conversations);
  const active = conversations[state.activeConvo];

    <div class="msg-title-row">
      <div><div class="section-eyebrow">YOUR CONVERSATIONS</div><div class="section-title">Keep it <span class="accent">moving.</span></div></div>

    </div>
    <div class="msg-grid ${state.threadOpenMobile?'thread-open':''}">
      <div class="conv-list">
        <div class="conv-list-head"><b>Inbox</b><span class="unread-tag">${Object.values(conversations).reduce((a,c)=>a+c.unread,0)} unread</span></div>
        ${convoIds.map(id=>{
          const c = conversations[id]; const last = c.messages[c.messages.length-1];
          return `
          <div class="conv-row ${id===state.activeConvo?'active':''}" onclick="openConvo('${id}')">
            <div class="conv-avatar">${initials(c.name)}</div>
            <div class="conv-body"><div class="conv-top"><span class="conv-name">${c.name}</span><span class="conv-time">${last.time}</span></div>
              <div class="conv-preview">${last.text}</div></div>
            ${c.unread>0 ? '<div class="conv-dot"></div>' : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="msg-thread">
        <div class="thread-head">
          <div class="thread-who">
            <button class="back-conv" onclick="closeConvoMobile()">${ICONS.chevLeft} Back</button>
            <div class="conv-avatar">${initials(active.name)}</div>
            <div><div style="font-weight:700; font-size:15px;">${active.name}</div>
              <div class="status-line">${active.online?'<span class="dot"></span> Online now':'Last seen recently'}</div></div>
          </div>
        </div>
        <div class="listing-ref">
          <img src="${active.listing.img}"/>
          <div class="listing-ref-body"><div class="listing-ref-label">About this listing</div><div class="listing-ref-name">${active.listing.name}</div><div class="listing-ref-price">${active.listing.price}</div></div>
          <span style="color:var(--text-faint)">${ICONS.arrow}</span>
        </div>
        <div class="thread-scroll" id="threadScroll">
          <div class="day-sep">Today</div>
          ${active.messages.map(m=>`<div class="bubble ${m.from==='me'?'me':'them'}">${m.text}<div class="bubble-time">${m.time}</div></div>`).join('')}
        </div>
        <div class="thread-input">
          <input id="chatInput" type="text" placeholder="Write a message..." onkeydown="if(event.key==='Enter') sendMessage()"/>
          <button class="send-btn" onclick="sendMessage()">${ICONS.send}</button>
        </div>
      </div>
    </div>
  </section>`;
}
function openConvo(id){ state.activeConvo = id; conversations[id].unread = 0; state.threadOpenMobile = true; render(); }
function closeConvoMobile(){ state.threadOpenMobile = false; render(); }
function sendMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if(!text) return;
  conversations[state.activeConvo].messages.push({from:'me', text, time:'Just now'});
  input.value=''; renderMainOnly();
  setTimeout(()=>{ const s=document.getElementById('threadScroll'); if(s) s.scrollTop = s.scrollHeight; }, 0);
}

    </div>
    <div class="stat-row">
      <div class="stat-cell"><div class="stat-num">${mine.length || user.listings}</div><div class="stat-label">Active listings</div></div>
      <div class="stat-cell"><div class="stat-num">${user.sold}</div><div class="stat-label">Items sold</div></div>
      <div class="stat-cell"><div class="stat-num">${user.rating}</div><div class="stat-label">Seller rating</div></div>
      <div class="stat-cell"><div class="stat-num">${user.views}</div><div class="stat-label">Profile views</div></div>
    </div>
    <div class="tab-row">
      <button class="tab-btn ${state.profileTab==='listings'?'active':''}" onclick="setProfileTab('listings')">Listings</button>
      <button class="tab-btn ${state.profileTab==='sold'?'active':''}" onclick="setProfileTab('sold')">Sold</button>
      <button class="tab-btn ${state.profileTab==='wishlist'?'active':''}" onclick="setProfileTab('wishlist')">Wishlist ${state.wishlist.size?`<span class="tab-count">${state.wishlist.size}</span>`:''}</button>
    </div>
    ${listForTab.length ? `<div class="item-grid">${listForTab.map(ItemCard).join('')}</div>` : `
      <div class="empty-state"><div class="es-icon">${ICONS.heart}</div>
        <div class="empty-title">${state.profileTab==='wishlist' ? 'Your wishlist is empty.' : (state.profileTab==='sold' ? 'Nothing sold yet.' : 'Nothing here yet.')}</div>
        <div>${state.profileTab==='sold' ? 'Items you sell will show up here.' : (state.profileTab==='wishlist' ? 'Save items you like to find them later.' : 'Be the first student to list something.')}</div></div>`}
  </section>`;
}
function setProfileTab(t){ state.profileTab = t; render(); }

// ---------- DASHBOARD ----------
function viewDashboard(){
  const mine = items.filter(i => Number(i.id.replace('i','')) > 100);
  const active = mine.length || user.listings;
  return `
  <section class="dash-wrap wrap">
    <div class="section-eyebrow">SELLER DASHBOARD</div>
    <div class="section-title">Your listings,<br/><span class="accent">at a glance.</span></div>
    <div class="dash-stats">
      <div class="dash-stat reveal">
        <div class="dash-stat-icon" style="background:var(--accent-soft); color:var(--accent);">${ICONS.layers}</div>
        <div><div class="dash-stat-num">${active}</div><div class="dash-stat-label">Active listings</div></div>
      </div>
      <div class="dash-stat reveal" style="--delay:80ms">
        <div class="dash-stat-icon" style="background:var(--green-soft); color:var(--green);">${ICONS.tag}</div>
        <div><div class="dash-stat-num">${user.sold}</div><div class="dash-stat-label">Sold items</div></div>
      </div>
      <div class="dash-stat reveal" style="--delay:160ms">
        <div class="dash-stat-icon" style="background:var(--surface); color:var(--text-dim);">${ICONS.fileClock}</div>
        <div><div class="dash-stat-num">3</div><div class="dash-stat-label">Drafts</div></div>
      </div>
    </div>
    <div class="section-head"><div class="section-title" style="font-size:20px;">Active listings</div>
      <a class="link-arrow" href="#/sell">New listing ${ICONS.plus}</a></div>
    <div class="item-grid">${(mine.length?mine:items.slice(0,4)).map(ItemCard).join('')}</div>
  </section>`;
}

// ---------- root render ----------
function routeBody(){
  const path = (state.route.split('?')[0]) || '#/';
  if(path === '#/' || path === '') return viewHome();
  if(path === '#/marketplace') return viewMarketplace();
  if(path.startsWith('#/item/')) return viewItem(path.replace('#/item/',''));
  if(path === '#/sell') return viewSell();
  if(path === '#/messages') return viewMessages();
  if(path === '#/profile') return viewProfile();
  if(path === '#/dashboard') return viewDashboard();
  return viewHome();
}

function render(){
  document.getElementById('app').innerHTML = `
    ${Header()}
    <main id="main-content">${routeBody()}</main>
    ${Footer()}
    ${BottomNav()}
  `;
  requestAnimationFrame(mountReveals);
}

state.route = location.hash || '#/';
document.documentElement.setAttribute('data-theme', theme);
render();
setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 2800);
</script>
</body>
</html>
